<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body { height: 100%; }

body {
  font-family: "EB Garamond", "Garamond", "Times New Roman", Times, serif;
  font-weight: 400;
  background: #ffffff;
  color: #1a1a1a;
  min-height: 100vh;
  display: flex;

}

.org-name { font-size: 22px; }
.org-sub { font-size: 17px; }

main {
  text-align: center;
  padding: 72px 0 56px;
}

.name {
  font-size: 48px;
  line-height: 1.1;
}

.role {
  margin-top: 14px;
  font-size: 22px;
}

footer {
  text-align: center;
  font-size: 16px;
  line-height: 1.6;
}

@media (max-width: 560px) {
  .card { padding: 36px 24px; }
  header { flex-direction: column; align-items: center; text-align: center; gap: 16px; }
  .contact-left, .contact-right { text-align: center; }
  main { padding: 56px 0 40px; }
  .name { font-size: 36px; }
